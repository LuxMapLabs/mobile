name: Android CD

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Distribute Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and target
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' must look like v1.2.3"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag '$GITHUB_REF_NAME' points to a commit that is not on main"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "groups=testers" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version_name=0.0.${GITHUB_RUN_NUMBER}-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "groups=dev-team" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD FIREBASE_APP_ID FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run unit tests
        timeout-minutes: 15
        run: ./gradlew testLocalDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed server release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew assembleServerRelease
          -PversionCode=${{ steps.meta.outputs.version_code }}
          -PversionName=${{ steps.meta.outputs.version_name }}

      - name: Prepare APK and release notes
        id: out
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          IS_RELEASE: ${{ steps.meta.outputs.is_release }}
        run: |
          APK="$RUNNER_TEMP/luxmap-server-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/server/release/app-server-release.apk "$APK"
          NOTES="$RUNNER_TEMP/release-notes.txt"
          if [ "$IS_RELEASE" = "true" ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"
            git log "$RANGE" --no-merges --pretty='- %s' > "$NOTES"
          else
            git log -1 --pretty='%s (%h)' > "$NOTES"
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS"
          GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS" npx --yes firebase-tools@15.36.0 \
            appdistribution:distribute "${{ steps.out.outputs.apk }}" \
            --app "$FIREBASE_APP_ID" \
            --groups "${{ steps.meta.outputs.groups }}" \
            --release-notes-file "${{ steps.out.outputs.notes }}"

      - name: Create GitHub Release
        if: steps.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "${{ steps.out.outputs.apk }}"
          --title "LuxMap Mobile $GITHUB_REF_NAME"
          --notes-file "${{ steps.out.outputs.notes }}"
          --verify-tag

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxmap-server-${{ steps.meta.outputs.version_name }}
          path: ${{ steps.out.outputs.apk }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ steps.meta.outputs.version_name }}
          path: app/build/outputs/mapping/serverRelease/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json"
